<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>
      Blue Moon Media | Social Media Marketing & Digital Marketing Agency
    </title>

    <meta
      name="description"
      content="Blue Moon Media is a leading Social Media Marketing and Digital Marketing Agency offering Social Media Management, Branding, Graphic Design, Video Editing, Content Creation, Performance Marketing, Website Development and Digital Growth Services."
    />

    <meta
      name="keywords"
      content="Blue Moon Media, Social Media Agency, Digital Marketing Agency, Social Media Marketing, Instagram Marketing, Facebook Marketing, Branding, Logo Design, Graphic Design, Website Development, Video Editing, Content Creation, SEO, Google Ads, Meta Ads, Tamil Nadu"
    />

    <meta name="author" content="Blue Moon Media" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://bluemoonmedia.in/"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Blue Moon Media | Social Media Marketing & Digital Marketing Agency"
    />

    <meta
      property="og:description"
      content="Grow your business with Blue Moon Media. We provide Branding, Social Media Marketing, Website Development, Graphic Design, Video Editing, SEO and Performance Marketing."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://bluemoonmedia.in/"
    />

    <meta
      property="og:image"
      content="https://bluemoonmedia.in/favicon.ico"
    />

    <meta
      property="og:site_name"
      content="Blue Moon Media"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Blue Moon Media | Social Media Marketing Agency"
    />

    <meta
      name="twitter:description"
      content="Helping brands grow through Social Media Marketing, Branding, Graphic Design, Website Development and Digital Marketing."
    />

    <meta
      name="twitter:image"
      content="https://bluemoonmedia.in/favicon.ico"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
